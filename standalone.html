            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fade-in overflow-y-auto">
              <div className="relative w-full max-w-3xl bg-[#12141C] border border-white/10 rounded-3xl overflow-hidden shadow-2xl my-auto">
                <button onClick={() => setSelectedMovie(null)} className="absolute top-4 right-4 z-20 p-2 rounded-full bg-black/60 text-white">
                  <IconX className="w-5 h-5" />
                </button>
                <div className="relative h-64 bg-black">
                  <img src={selectedMovie.backdropUrl} alt={selectedMovie.title} className="w-full h-full object-cover opacity-75" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#12141C] to-transparent" />
                </div>
                <div className="p-6 -mt-16 relative z-10 space-y-4">
                  <h2 className="text-3xl font-black font-display text-white">{selectedMovie.title}</h2>
                  <p className="text-xs text-purple-300 font-medium italic">"{selectedMovie.tagline}"</p>
                  <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">{selectedMovie.overview}</p>
                  <div className="flex gap-3 pt-2">
                    <button onClick={() => setTrailerMovie(selectedMovie)} className="px-5 py-2.5 rounded-xl bg-purple-600 text-white text-xs font-bold flex items-center gap-1.5 shadow-lg">
                      <IconPlay className="w-4 h-4" fill={true} /> Watch Trailer
                    </button>
                    <button onClick={() => toggleWatchlist(selectedMovie)} className="px-4 py-2.5 rounded-xl bg-white/10 text-white text-xs font-medium border border-white/10">
                      Save to Watchlist
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Trailer Modal */}
          {trailerMovie && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fade-in">
              <div className="w-full max-w-4xl bg-[#12141C] border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
                <div className="flex justify-between items-center px-4 py-3 border-b border-white/10 bg-[#161922]">
                  <span className="text-sm font-bold text-white">{trailerMovie.title} — Official Trailer</span>
                  <button onClick={() => setTrailerMovie(null)} className="p-1 rounded text-slate-400 hover:text-white"><IconX className="w-5 h-5" /></button>
                </div>
                <div className="aspect-video bg-black">
                  <iframe
                    src={`https://www.youtube-nocookie.com/embed/${trailerMovie.trailerKey}?autoplay=1&rel=0`}
                    title={trailerMovie.title}
                    className="w-full h-full border-0"
                    allowFullScreen
                  />
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl bg-[#12141C] border border-purple-500/40 text-white text-xs font-medium shadow-2xl animate-fade-in flex items-center gap-2">
              <IconCheck className="w-4 h-4 text-emerald-400" />
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-white/5 bg-[#06070A] py-10 mt-20 text-center text-xs text-slate-500">
            <p>© 2026 CineVerse AI. Designed with cinematic precision.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CineVerseApp />);
  </script>
</body>
</html>
