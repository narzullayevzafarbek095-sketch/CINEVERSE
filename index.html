    // --- State Storage ---
    function getStoredWatchlist() {
      try {
        const d = localStorage.getItem('cineverse_watchlist');
        return d ? JSON.parse(d) : [
          { movieId: 'dune-2', movie: MOVIES[0], watched: true, personalRating: 10 },
          { movieId: 'oppenheimer', movie: MOVIES[1], watched: true, personalRating: 9 }
        ];
      } catch {
        return [];
      }
    }

    function saveStoredWatchlist(list) {
      localStorage.setItem('cineverse_watchlist', JSON.stringify(list));
    }

    // --- App State ---
    let state = {
      view: 'home', // 'home' | 'discover' | 'trending' | 'watchlist' | 'profile' | 'admin'
      searchQuery: '',
      selectedGenre: 'All',
      watchlist: getStoredWatchlist(),
      selectedMovie: null,
      trailerMovie: null,
      aiFinderOpen: false,
      settingsOpen: false,
      toastMsg: null,
      adminAuth: false,
      adminPassInput: '',
      aiMood: 'Mind-Bending',
      aiResults: null
    };

    function setState(patch) {
      state = { ...state, ...patch };
      render();
    }

    function showToast(text) {
      setState({ toastMsg: text });
      setTimeout(() => {
        if (state.toastMsg === text) setState({ toastMsg: null });
      }, 3500);
    }

    function toggleWatchlist(movie) {
      const exists = state.watchlist.some(w => w.movieId === movie.id);
      let next;
      if (exists) {
        next = state.watchlist.filter(w => w.movieId !== movie.id);
        saveStoredWatchlist(next);
        setState({ watchlist: next });
        showToast(`Removed "${movie.title}" from Watchlist`);
      } else {
        next = [{ movieId: movie.id, movie, watched: false }, ...state.watchlist];
        saveStoredWatchlist(next);
        setState({ watchlist: next });
        showToast(`Added "${movie.title}" to Watchlist! ⭐`);
      }
    }

    function toggleWatched(movieId) {
      const next = state.watchlist.map(item => {
        if (item.movieId === movieId) {
          return { ...item, watched: !item.watched };
        }
        return item;
      });
      saveStoredWatchlist(next);
      setState({ watchlist: next });
    }

    // --- Global Window Handler Attachments ---
    window.navTo = (v) => { setState({ view: v }); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    window.setGenre = (g) => setState({ selectedGenre: g });
    window.setSearch = (q) => setState({ searchQuery: q });
    window.toggleWatch = (id) => {
      const movie = MOVIES.find(m => m.id === id);
      if (movie) toggleWatchlist(movie);
    };
    window.toggleWatchedStatus = (id) => toggleWatched(id);
    window.viewMovieDetails = (id) => {
      const m = MOVIES.find(movie => movie.id === id);
      if (m) setState({ selectedMovie: m });
    };
    window.closeMovieDetails = () => setState({ selectedMovie: null });
    window.playTrailer = (id) => {
      const m = MOVIES.find(movie => movie.id === id);
      if (m) setState({ trailerMovie: m });
    };
    window.closeTrailer = () => setState({ trailerMovie: null });
    window.openAiModal = () => setState({ aiFinderOpen: true });
    window.closeAiModal = () => setState({ aiFinderOpen: false });
    window.selectAiMood = (mood) => setState({ aiMood: mood });
    window.synthesizeAiRecommendation = () => {
      const match = MOVIES.find(m => m.moods.includes(state.aiMood)) || MOVIES[0];
      setState({ aiFinderOpen: false, selectedMovie: match });
      showToast(`AI Match: ${match.title} (${match.cineVerseScore}% Synergy)!`);
    };
    window.openSettingsModal = () => setState({ settingsOpen: true });
    window.closeSettingsModal = () => setState({ settingsOpen: false });
    window.showToastMsg = (txt) => showToast(txt);
    window.authAdmin = () => {
      const input = document.getElementById('adminPassInput');
      if (input && input.value === 'cineverse2026') {
        setState({ adminAuth: true });
        showToast('Admin session authenticated!');
      } else {
        alert('Invalid passcode. Default passcode is: cineverse2026');
      }
    };

    // Initial render call
    render();
  </script>
</body>
</html>
